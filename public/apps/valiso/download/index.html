<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download Valiso — Travel Packing List</title>
  <meta name="description" content="Pack smarter with Valiso. Download Travel Packing List for iPhone and Android.">
  <meta name="theme-color" content="#fdf6ec">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fdf6ec; color: #26221e; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 440px; text-align: center; }
    .brand { color: #ad4023; font-weight: 750; letter-spacing: .18em; font-size: 14px; }
    h1 { font-size: clamp(36px, 9vw, 48px); line-height: 1.1; margin: 20px 0; letter-spacing: -.04em; }
    p { line-height: 1.6; color: #63584e; }
    .stores { display: grid; gap: 12px; margin-top: 30px; }
    .stores a { display: block; padding: 17px 24px; border-radius: 14px; background: #26221e; color: white; text-decoration: none; font-weight: 650; }
    .stores a:hover { background: #ad4023; }
    a:focus-visible { outline: 3px solid #ad4023; outline-offset: 5px; }
    footer { margin-top: 36px; }
    footer a { color: #63584e; font-size: 14px; text-underline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">VALISO</div>
    <h1>Ready. Set. Packed.</h1>
    <p>Your next trip starts with a smarter packing list.</p>
    <p id="status" role="status">Get Valiso for your phone.</p>
    <nav class="stores" aria-label="Download Valiso">
      <a id="ios" href="https://apps.apple.com/us/app/travel-packing-list-valiso/id6816232418">Download on the App Store</a>
      <a id="android" href="https://play.google.com/store/apps/details?id=com.valiso.travelpackinglist">Get it on Google Play</a>
    </nav>
    <footer><a href="https://www.tafix.co/">Made by Tafix</a></footer>
  </main>
  <script>
    (() => {
      const ua = navigator.userAgent || '';
      const isAndroid = /Android/i.test(ua);
      // iPadOS can identify itself as a Mac when requesting desktop websites.
      const isAppleMobile = /iPhone|iPad|iPod/i.test(ua) ||
        (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
      const storeId = isAndroid ? 'android' : isAppleMobile ? 'ios' : null;
      if (!storeId) return;
      document.getElementById('status').textContent =
        'Opening your app store… If it does not open, tap a button below.';
      window.location.replace(document.getElementById(storeId).href);
    })();
  </script>
</body>
</html>
